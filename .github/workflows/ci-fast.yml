# ci-fast (P0-T08 skeleton): runs on every push/PR. Engine, UI and eval jobs
# arrive with their phases; this skeleton gates what exists today.
name: ci-fast
on: [push, pull_request]
jobs:
  brand-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tools/brand-lint.sh
  state-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/state-check.py
  docs-check:
    # Docs stay reachable: every doc is indexed in docs/README.md or cited by
    # name in the repo (tools/docs-check.mjs). Sediment fails the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tools/docs-check.mjs
  plan-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The previous product name must not appear outside the allow-list
      # (PROVENANCE.md carries the required attribution).
      - run: ./tools/brand-lint.sh docs/planning docs/astra tools branding
  contract-harness:
    # P1-T11: no-browser self-test of the geckodriver contract harness.
    # Proves runner + fixture are sound without a 70-minute engine build.
    # Full `forge test` (needs the built binary) runs where a build exists.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/contract-runner/run.py --fixture-only
      - run: python3 tests/contract/p1t11-contract.py --fixture-only
