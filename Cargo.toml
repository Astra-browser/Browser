[workspace]
members = [
  "crates/astra-core",
  "crates/astra-host-trait",
  "crates/astra-store",
  "crates/astra-proto",
  "crates/astra-ipc",
  "crates/astra-import",
  "crates/astra-blocker",
]
exclude = [
  # Standalone tool with its own lockfile/target dir (P1-T12); must not be
  # pulled into the root workspace.
  "forge/astra-forge",
]
resolver = "2"
