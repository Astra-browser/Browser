# Astra branding — single source of names/IDs (D-19)
# Anything marked OWNER_DECISION blocks release builds only;
# dev builds use clearly-marked dev defaults.

display_name = "Astra"
binary_name = "astra"

# Astra's own product version. This is NOT the Firefox/Gecko pin — upstream.toml
# owns that. It is the build handed to dev/alpha testers: bump it on every build
# that leaves this machine, so About and the package name identify what they ran.
version = "0.1.755"
app_id = "OWNER_DECISION"            # reverse-DNS, e.g. com.example.astra (dev default: com.astra.dev)
app_id_dev_suffix = "dev"
vendor = "OWNER_DECISION"
homepage = "OWNER_DECISION"
update_host = "OWNER_DECISION"        # host serving MAR manifests (dev default: localhost fixture)
support_url = "OWNER_DECISION"
docs_url = "OWNER_DECISION"

[profile_dirs]
linux = "astra"
windows = "Astra"
macos = "Astra"

# Astra mark, v1 (D-38). Masters live in branding/assets/; every raster is
# generated from them by `python3 tools/brand-assets.py` — never hand-edit the
# PNG/ICO/ICNS outputs.
[icons]
svg = "overlay/astra/branding/astra-logo.svg"
png_512 = "overlay/astra/branding/astra-icon-512.png"
icns = "overlay/astra/branding/astra.icns"
ico = "overlay/astra/branding/astra.ico"

ua_token = "Astra"                   # appended to the Firefox-compatible UA (D-14)
