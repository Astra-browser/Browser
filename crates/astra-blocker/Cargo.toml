[package]
name = "astra-blocker"
version = "0.1.0"
edition = "2021"
description = "Astra network/cosmetic blocker: adblock-rust wrapper with EasyList/EasyPrivacy seed (P4-T01)"
license = "MPL-2.0"

[dependencies]
adblock = { version = "0.13.5", default-features = false, features = ["full-regex-handling", "css-validation", "embedded-domain-resolver"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
