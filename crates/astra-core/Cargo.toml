[package]
name = "astra-core"
version = "0.1.0"
edition = "2021"
description = "Astra core services: pure browser-logic domains decoupled from any shell runtime (P2-T01)"
license = "MPL-2.0"

[dependencies]
astra-host-trait = { path = "../astra-host-trait" }
astra-extensions = { path = "../astra-extensions" }
astra-proto = { path = "../astra-proto" }
astra-store = { path = "../astra-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "astra-core"
path = "src/bin/astra_core.rs"
