[package]
name = "astra-extensions"
version = "0.2.0"
edition = "2021"
description = "Astra extension platform: Chrome CRX intake, manifest adaptation, compatibility and security analysis, plus the AMO gallery model"
license = "MPL-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ring = "0.17"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = "1"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
