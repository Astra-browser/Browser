[package]
name = "astra-host-trait"
version = "0.1.0"
edition = "2021"
description = "BrowserHost seam: UI and astra-core talk to the browser engine only through this trait (P2-T01)"
license = "MPL-2.0"

[dependencies]
astra-ipc = { path = "../astra-ipc" }
astra-proto = { path = "../astra-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
