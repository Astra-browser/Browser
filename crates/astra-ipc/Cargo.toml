[package]
name = "astra-ipc"
version = "0.1.0"
edition = "2021"
description = "IPC transport for Astra core/browser link: framing, backpressure, heartbeats, auth, crash recovery (P2-T03)"
license = "MPL-2.0"

[lib]
name = "astra_ipc"
path = "src/lib.rs"

[dependencies]
astra-proto = { path = "../astra-proto" }
getrandom = "0.3"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread"] }
