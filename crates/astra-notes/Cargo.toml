[package]
name = "astra-notes"
version = "0.1.0"
edition = "2021"
description = "Astra notes: Markdown files in a user-chosen folder, indexed in astra-store, with live file watching (P5-T03)"
license = "MPL-2.0"

[dependencies]
astra-store = { path = "../astra-store" }
notify = "8"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
