[package]
name = "astra-store"
version = "0.1.0"
edition = "2021"
description = "Astra SQLite store: rusqlite (bundled) + rusqlite_migration, WAL mode, Appendix B schema"
license = "MPL-2.0"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2"
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
proptest = "1"
tempfile = "3"
