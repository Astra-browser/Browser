[package]
name = "astra-tasks"
version = "0.1.0"
edition = "2021"
description = "Astra tasks domain: lists, priorities, deadlines, subtasks, linked pages, natural-language parser (P5-T01)"
license = "MPL-2.0"

[dependencies]
astra-store = { path = "../astra-store" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
