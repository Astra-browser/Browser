[package]
name = "astra-time"
version = "0.1.0"
edition = "2021"
description = "Astra time tracking: per-site totals from tab-activity events, focus timer, focus-mode site blocking (P5-T04)"
license = "MPL-2.0"

[dependencies]
astra-core = { path = "../astra-core" }
astra-store = { path = "../astra-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
astra-notes = { path = "../astra-notes" }
astra-tasks = { path = "../astra-tasks" }
tempfile = "3"
