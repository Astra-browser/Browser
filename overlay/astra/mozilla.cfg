//
// Astra autoconfig (P1-T06). Shipped as dist/bin/mozilla.cfg via
// FINAL_TARGET_FILES in overlay/astra/moz.build. Runs AFTER every defaults
// file including browser/defaults/preferences/firefox.js (which sets
// app.normandy.enabled=true at $SRCDIR/browser/app/profile/firefox.js:2871),
// so plain defaults/pref files cannot hold this posture — lockPref can.
// Evidence per pref: docs/astra/PRIVACY_PREFS.md.

// No Normandy policy exists in the pinned source; prefs are the only path
// (BUILD_FLAGS.md D-26). Consumer: normandy/lib/RecipeRunner.sys.mjs:43.
lockPref("app.normandy.enabled", false);
lockPref("app.shield.optoutstudies.enabled", false);

// Defense in depth alongside the DisableTelemetry policy lock.
lockPref("datareporting.healthreport.uploadEnabled", false);
lockPref("datareporting.policy.dataSubmissionEnabled", false);

// No Pocket policy implementation in the pinned source (DisablePocket is
// schema-only), so Pocket/sponsored surfaces die here. Branch verified:
// newtab/lib/ActivityStreamPrefs.sys.mjs:20; keys verified in TopSitesFeed,
// AdsFeed, DiscoveryStreamFeed, AboutPreferences.
lockPref("browser.newtabpage.activity-stream.showSponsoredTopSites", false);
lockPref("browser.newtabpage.activity-stream.feeds.section.topstories", false);
lockPref("browser.newtabpage.activity-stream.discoverystream.enabled", false);
lockPref("browser.newtabpage.activity-stream.asrouter.userprefs.cfr.addons", false);
lockPref("browser.newtabpage.activity-stream.asrouter.userprefs.cfr.features", false);

// Browser-wide fingerprinting and tracker protection. FPP is Firefox's
// low-breakage fingerprinting defence (canvas randomization, font visibility,
// screen/hardware-concurrency tiering); RFP stays opt-in because its strict
// spoofing breaks sites. Private browsing already has FPP on by default.
defaultPref("privacy.fingerprintingProtection", true);
defaultPref("privacy.fingerprintingProtection.pbmode", true);
// Strengthen FPP beyond its low-breakage default: hide the GPU model, audio
// stack parameters, media/network capabilities, base-system fonts and display
// metrics. User-agent, timezone and screen-rect spoofing stay off so sites
// keep working; RFP remains an opt-in for people who want full spoofing.
defaultPref("privacy.fingerprintingProtection.overrides", "+WebGLRenderInfo,+WebGLVendorSanitize,+WebGLRendererConstant,+AudioContext,+AudioSampleRate,+MediaCapabilities,+NetworkConnection,+FontVisibilityBaseSystem,+CSSResolution,+CSSDeviceSize,+CSSColorInfo,+ReduceTimerPrecision");

// Per-space isolation (D-44). Firefox's login manager and form-history store
// are keyed by origin, not by `userContextId`, so a credential saved in one
// Astra space would be offered to another space's tabs. Until the engine can
// partition those stores, Astra keeps the global ones off; password managers
// (Bitwarden, 1Password, the OS vault) still work through their extensions.
// See docs/astra/PASSWORD_DECISION.md (option B) and docs/astra/SPACES.md.
defaultPref("signon.rememberSignons", false);
defaultPref("signon.autofillForms", false);
defaultPref("signon.formlessCapture.enabled", false);
defaultPref("signon.management.page.breach-alerts.enabled", false);
defaultPref("signon.recipes.remoteRecipes.enabled", false);
defaultPref("browser.formfill.enable", false);
defaultPref("extensions.formautofill.addresses.enabled", false);
defaultPref("extensions.formautofill.creditCards.available", false);

// Astra ad/tracker blocker defaults (ASTRA-0004 / Blocker.sys.mjs). The
// rules themselves live in `blocker/` and are installed by the Host module;
// these are the switches the Settings page and the scheduler read.
defaultPref("astra.blocker.enabled", true);
defaultPref("astra.blocker.update-hours", 24);
defaultPref("astra.blocker.update-on-startup", true);
defaultPref("astra.blocker.cosmetic", true);
defaultPref("astra.blocker.scriptlets", true);
defaultPref("astra.blocker.removeparam", true);
defaultPref("astra.blocker.bounce", true);
defaultPref("astra.blocker.block-scripts", false);
defaultPref("astra.blocker.redirects", true);
defaultPref("astra.blocker.cname-uncloaking", true);
defaultPref("astra.blocker.mode", 0);
defaultPref("astra.privacy.cookies-mode", "partition");
defaultPref("astra.privacy.forget-on-close", false);
defaultPref("astra.privacy.ephemeral-storage", false);
defaultPref("astra.privacy.fingerprint-mode", "standard");
defaultPref("astra.privacy.language-spoof", false);
defaultPref("astra.privacy.screen-spoof", false);
defaultPref("astra.privacy.bounce-protection", true);

// P5: Firefox SessionStore is the live tab/session source. Seed "continue"
// only when the person has not chosen a startup mode; an unconditional pref
// here would overwrite Settings on every launch.
if (!Services.prefs.prefHasUserValue("browser.startup.page")) {
  pref("browser.startup.page", 3);
}

// Astra's Tabs setting defaults automatic picture-in-picture on. The engine
// default is off, and the app only writes the pref when the person touches
// the switch, so seed it once here. A user value (including the person
// turning it off) always wins.
if (
  !Services.prefs.prefHasUserValue(
    "media.videocontrols.picture-in-picture.enable-when-switching-tabs.enabled"
  )
) {
  pref("media.videocontrols.picture-in-picture.enable-when-switching-tabs.enabled", true);
}
// P6c: the app renders certificate errors. The engine's own page must not
// offer a permanent override behind it.
pref("security.certerror.hideAddException", true);
pref("security.certerrors.permanentOverride", false);
pref("browser.sessionstore.resume_from_crash", true);
pref("browser.sessionstore.restore_on_demand", true);
pref("browser.sessionstore.restore_tabs_lazily", true);
