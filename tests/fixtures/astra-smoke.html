   its DOM, nothing more. Marker protocol: #astra-fixture-ok must contain
   exactly "ASTRA-FIXTURE-OK". -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Astra Contract Fixture</title>
  </head>
  <body>
    <main>
      <h1>Contract fixture</h1>
      <p id="astra-fixture-ok">ASTRA-FIXTURE-OK</p>
    </main>
  </body>
</html>
