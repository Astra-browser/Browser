class = "REMOVE"
reason = "Pocket Discover feed; Pocket surfaces die via P1-T06 newtab prefs."
disable = "pref browser.newtabpage.activity-stream.discoverystream.enabled=false (P1-T06)"
owner_signoff = false
source = "https://www.abcdesktop.io/faq/disable-firefox-connections/; docs/astra/PRIVACY_PREFS.md"

[[endpoint]]
host = "push.services.mozilla.com"
