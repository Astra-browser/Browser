source = "engine/toolkit/components/normandy/lib/NormandyApi.sys.mjs:16; engine/browser/app/profile/firefox.js (app.normandy.api_url)"

[[endpoint]]
host = "location.services.mozilla.com"
match = "exact"
class = "REMOVE"
reason = "Region/geo lookup; blanked by abcdesktop-verified pref override; no Astra feature needs it."
disable = "pref browser.region.network.url=''"
owner_signoff = false
source = "engine/modules/libpref/init/all.js (browser.region.network.url); https://www.abcdesktop.io/faq/disable-firefox-connections/"

[[endpoint]]
host = "contile.services.mozilla.com"
match = "exact"
class = "REMOVE"
reason = "Sponsored Top Sites (Contile); Astra ships no sponsored tiles."
disable = "pref browser.topsites.contile.enabled=false, browser.topsites.contile.endpoint=''"
owner_signoff = false
source = "engine/browser/app/profile/firefox.js (browser.topsites.contile.endpoint)"

[[endpoint]]
host = "spocs.getpocket.com"
