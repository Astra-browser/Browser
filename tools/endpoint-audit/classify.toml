[[endpoint]]
host = "update.googleapis.com"
match = "exact"
class = "KEEP"
reason = "Widevine CDM (L3) Chromium update URL. Astra ships protected-content playback (mozilla.cfg defaultPref media.eme.enabled=true), so the proprietary CDM must be able to fetch its updates. Owner approved shipping Widevine on 2026-11-08."
disable = "pref media.gmp-widevinecdm.allow-chromium-update=false / media.gmp-manager.url repoint"
owner_signoff = true
source = "engine/browser/app/profile/firefox.js:2373 (media.gmp-manager.chromium-update-url)"

[[endpoint]]
host = "www.google.com"
match = "suffix"
class = "REPLACE"
reason = "Observed once at idle in live run (2026-11-01); no static pref pins it — suspected search-service icon/config fetch for the default engine. No Astra feature needs direct Google contact; ship Astra search config instead. Exact trigger to pin in follow-up."
disable = "follows services.settings.server + own search-config decision"
owner_signoff = false
source = "live audit 2026-11-01 (idle); engine/toolkit/components/search/SearchStaticData.sys.mjs (engine-side Google refs)"

