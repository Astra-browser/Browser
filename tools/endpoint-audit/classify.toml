# Endpoint classification for Astra (P1-T07).
# class: KEEP = security-critical, stays · REPLACE = reroute to Astra infra ·
#        REMOVE = must produce zero traffic (pref/policy/build flag in `disable`).
# owner_signoff: false = seeded by worker-t07, pending owner review.
# Every `source` was verified against ESR 153.6.0 in engine/ or fetched docs.

[[endpoint]]
host = "detectportal.firefox.com"
match = "suffix"
class = "REMOVE"
reason = "Captive-portal + connectivity checks; already off via P1-T06 (CaptivePortal policy + network.connectivity-service.enabled=false)."
disable = "policies.json CaptivePortal=false; prefs network.captive-portal-service.enabled=false, network.connectivity-service.enabled=false"
owner_signoff = false
source = "engine/modules/libpref/init/all.js:3257-3282 (IPv4/IPv6/canonical URLs); engine/browser/app/profile/firefox.js:1378"

[[endpoint]]
host = "example.org"
match = "exact"
class = "REMOVE"
reason = "Connectivity-service DNS check domain (DNSv4/DNSv6); dies with connectivity-service.enabled=false."
disable = "pref network.connectivity-service.enabled=false"
owner_signoff = false
source = "engine/modules/libpref/init/all.js:3258-3259"

[[endpoint]]
host = "cloudflare-dns.com"
match = "suffix"
class = "REMOVE"
reason = "Connectivity-service DNS_HTTPS check domain; dies with connectivity-service.enabled=false."
