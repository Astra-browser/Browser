<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Stress memory</title>
<style>html,body{margin:0;background:#0d1117;color:#c9d1d9;font:13px ui-monospace,monospace}main{padding:16px}</style>
</head>
<body>
<main id="m"><h1>memory pressure</h1></main>
<script>
  const params = new URLSearchParams(location.search);
  const mb = Math.max(1, Math.min(256, Number(params.get('mb') || 64)));
  const chunks = [];
  for (let i = 0; i < mb; i++) {
    const b = new Uint8Array(1024 * 1024);
    // Touch every page so the memory is resident, not just virtual.
    for (let o = 0; o < b.length; o += 4096) b[o] = (i + o) & 255;
    chunks.push(b);
  }
  const root = document.getElementById('m');
  for (let i = 0; i < 12000; i++) {
    const d = document.createElement('div');
    d.textContent = `node ${i} — ${'x'.repeat(40)}`;
    root.appendChild(d);
  }
  window.__chunks = chunks;
</script>
<script src="/common.js"></script>
</body>
</html>
