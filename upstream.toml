# Pinned Firefox upstream (D-01, D-58). Edited by hand: `forge fetch` reads
# `version` and `url` only, and there is no `forge bump` subcommand.
channel = "release"        # D-58: off the ESR channel; the pin is channel-agnostic
version = "160.0.1"        # verified 2026-11-23 via endoflife.date (released 2026-11-10); see docs/astra/UPSTREAM.md
source = "tarball"         # or "git"
url = "https://archive.mozilla.org/pub/firefox/releases/160.0.1/source/firefox-160.0.1.source.tar.xz"   # verified HTTP 200, 2026-11-23 (819,616,824 bytes)
sha256 = "GPG-ONLY"          # Mozilla ships .asc signature, no SHA256SUMS for source tarballs
signature_url = "https://archive.mozilla.org/pub/firefox/releases/160.0.1/source/firefox-160.0.1.source.tar.xz.asc"   # verified HTTP 200, 2026-11-23
git_ref = "FIREFOX_160_0_1_RELEASE"   # fallback if source = git; verify tag name
release_notes_url = "https://www.mozilla.org/firefox/notes/"
last_verified = "2026-11-23"
# EOL 2026-11-24: 160.0.1 is a rapid release, not an ESR. The 161.0 follow-up is
# its own ticket; do not treat this pin as long-lived.
